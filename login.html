<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pro Players | Dashboard</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #07110b;
      color: white;
      min-height: 100vh;
    }

    /* NAVBAR */
    .navbar {
      height: 70px;
      background: #0b1910;
      border-bottom: 1px solid #1f7a3a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
    }

    .logo {
      color: #32ff72;
      font-size: 22px;
      font-weight: bold;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .nav-links a {
      color: #d8e4dc;
      text-decoration: none;
      font-size: 14px;
    }

    .nav-links a:hover {
      color: #32ff72;
    }

    .logout {
      border: 1px solid #32ff72;
      padding: 9px 14px;
      border-radius: 8px;
      color: #32ff72 !important;
    }

    /* MAIN */
    .container {
      width: 90%;
      max-width: 1100px;
      margin: auto;
      padding: 40px 0;
    }

    .welcome {
      background: linear-gradient(135deg, #0d2114, #0a160e);
      border: 1px solid #1f7a3a;
      border-radius: 18px;
      padding: 30px;
      margin-bottom: 30px;
    }

    .welcome h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .
