<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pro Players | Dashboard</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #07110b;
      color: white;
      min-height: 100vh;
    }

    /* =========================
       NAVBAR
    ========================= */

    .navbar {
      min-height: 70px;
      background: #0b1910;
      border-bottom: 1px solid #1f7a3a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 6%;
      gap: 20px;
    }

    .logo {
      color: #32ff72;
      font-size: 22px;
      font-weight: bold;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      gap: 18px;
      align-items: center;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: #d8e4dc;
      text-decoration: none;
      font-size: 14px;
      transition: 0.2s;
    }

    .nav-links a:hover {
      color: #32ff72;
    }

    .logout {
      border: 1px solid #32ff72;
      padding: 9px 14px;
      border-radius: 8px;
      color: #32ff72 !important;
    }

    .logout:hover {
      background: #32ff72;
      color: #06100a !important;
    }

    /* =========================
       MAIN CONTAINER
    ========================= */

    .container {
      width: 90%;
      max-width: 1100px;
      margin: auto;
      padding: 40px 0;
    }

    /* =========================
       WELCOME
    ========================= */

    .welcome {
      background: linear-gradient(
        135deg,
        #0d2114,
        #0a160e
      );

      border: 1px solid #1f7a3a;
      border-radius: 18px;
      padding: 30px;
      margin-bottom: 30px;
    }

    .welcome h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .welcome h1 span {
      color: #32ff72;
    }

    .welcome p {
      color: #9aa79e;
      line-height: 1.6;
    }

    /* =========================
       SECTION TITLE
    ========================= */

    .section-title {
      margin-bottom: 18px;
      font-size: 21px;
    }

    /* =========================
       DASHBOARD CARDS
    ========================= */

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .card {
      background: #0d1b12;
      border: 1px solid #1b4429;
      border-radius: 15px;
      padding: 25px;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #32ff72;
      box-shadow: 0 8px 25px rgba(0, 255, 100, 0.08);
    }

    .card-icon {
      font-size: 32px;
      margin-bottom: 15px;
    }

    .card h3 {
      margin-bottom: 8px;
      font-size: 18px;
    }

    .card p {
      color: #929e96;
      font-size: 14px;
      line-height: 1.5;
    }
