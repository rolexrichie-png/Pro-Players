<form id="signupForm">

    <input
        type="text"
        id="name"
        placeholder="Your name"
        required
    >

    <input
        type="email"
        id="signupEmail"
        placeholder="Email address"
        required
    >

    <input
        type="password"
        id="signupPassword"
        placeholder="Password"
        required
    >

    <button type="submit">
        Create Account
    </button>

</form>

<p id="signupMessage"></p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
