<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pro Players | Create Account</title>

    <link rel="stylesheet" href="style.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(0, 255, 136, 0.12),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(0, 180, 255, 0.10),
                    transparent 35%
                ),
                #070b12;

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }


        .signup-container {
            width: 100%;
            max-width: 460px;
        }


        .brand {
            text-align: center;
            margin-bottom: 25px;
        }


        .brand h1 {
            font-size: 32px;
            margin-bottom: 5px;
        }


        .brand h1 span {
            color: #00ff88;
        }


        .brand p {
            color: #8e99a8;
            font-size: 14px;
        }


        .signup-card {
            background: rgba(15, 23, 34, 0.96);

            border: 1px solid #1f2c3d;

            border-radius: 18px;

            padding: 38px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45);

            backdrop-filter: blur(10px);
        }


        .signup-card h2 {
            font-size: 28px;
            margin-bottom: 8px;
        }


        .subtitle {
            color: #8e99a8;
            font-size: 14px;
            margin-bottom: 28px;
        }


        .form-group {
            margin-bottom: 18px;
        }


        .form-group label {
            display: block;
            margin-bottom: 8px;

            color: #d8dee7;

            font-size: 14px;
            font-weight: bold;
        }


        .form-group input {
            width: 100%;

            padding: 14px 15px;

            background: #0b111a;

            border: 1px solid #293648;

            border-radius: 9px;

            color: white;

            font-size: 15px;

            outline: none;

            transition: 0.3s;
        }


        .form-group input:focus {
            border-color: #00ff88;

            box-shadow:
                0 0 0 3px rgba(0, 255, 136, 0.08);
        }


        .password-note {
            margin-top: 7px;

            color: #6f7a89;

            font-size: 12px;
        }


        .signup-button {
            width: 100%;

            padding: 15px;

            margin-top: 8px;

            border: none;

            border-radius: 9px;

            background: #00ff88;

            color: #04120b;

            font-size: 16px;

            font-weight: 800;

            cursor: pointer;

            transition: 0.3s;
        }


        .signup-button:hover {
            background: #00d976;

            transform: translateY(-2px);

            box-shadow:
                0 10px 25px rgba(0, 255, 136, 0.15);
        }


        .signup-button:active {
            transform: translateY(0);
        }


        #signupMessage {
            text-align: center;

            margin-top: 15px;

            font-size: 14px;

            color: #00ff88;
        }


        .login-text {
            text-align: center;

            margin-top: 24px;

            color: #8994a3;

            font-size: 14px;
        }


        .login-text a {
            color: #00ff88;

            text-decoration: none;

            font-weight: bold;
        }


        .login-text a:hover {
            text-decoration: underline;
        }


        .back-home {
            display: block;

            text-align: center;

            margin-top: 22px;

            color: #788494;

            text-decoration: none;

            font-size: 13px;
        }


        .back-home:hover {
            color: white;
        }


        @media (max-width: 500px) {

            body {
                padding: 18px;
            }

            .signup-card {
                padding: 28px 22px;
            }

            .brand h1 {
                font-size: 28px;
            }

        }

    </style>

</head>


<body>


    <div class="signup-container">


        <!-- BRAND -->

        <div class="brand">

            <h1>
                🎮 Pro <span>Players</span>
            </h1>

            <p>
                Your ultimate gaming information hub
            </p>

        </div>


        <!-- SIGNUP CARD -->

        <div class="signup-card">

            <h2>
                Create your account
            </h2>

            <p class="subtitle">
                Join Pro Players and stay updated
